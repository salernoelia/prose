[package]
name = "prose"
version = "0.1.8"
description = "Cross-platform, local-first reader for ePub and PDF."
authors = ["Elia Salerno"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
epub = "2.1.5"
lopdf = "0.42.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
percent-encoding = "2"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
quick-xml = "0.37"

# iOS hands Share / "Open in place" files to us as security-scoped URLs that
# `std::fs` cannot read until the scope is started. We reach for that scope
# through Foundation's NSURL, which needs the objc2 bindings.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSData"] }

[dev-dependencies]
zip = "8.6.0"


